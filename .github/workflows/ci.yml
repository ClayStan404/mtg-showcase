name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test Python
        run: |
          ruff check scripts/ tests/
          python -m compileall -q scripts tests
          python -m pytest tests/ -q

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check and test JavaScript
        run: |
          npm ci
          for file in assets/*.js admin/*.js; do node --check "$file"; done
          npm run test:js
          npm run check:edge
          npm run build:vendor
          git diff --exit-code -- assets/vendor/supabase-js.min.js
